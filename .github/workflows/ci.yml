name: Windows validation

on:
  pull_request:
  push:
    branches: [main, feature/dynamic-quota-colors]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked
      - run: cargo build --release --locked
      - name: Verify PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @('scripts/install.ps1', 'scripts/uninstall.ps1')) {
            $errors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: cybersouls-taskbar-quota-hud-windows
          path: target/release/cybersouls-taskbar-quota-hud.exe
